# RModHub — container orchestration.
#
#   Sequence branch only (default):
#     docker compose up -d --build           -> `api` (FastAPI + MultiRM, CPU inference) and
#                                               `web` (nginx: React UI + reverse proxy)
#                                               -> open http://localhost:8080
#                                               (API directly: http://localhost:8000)
#
#   Sequence + nanopore signal branch (DirectRM jobs; profile "phase2"):
#     set POSTGRES_PASSWORD in .env, then
#     docker compose --profile phase2 up -d --build --wait
#                                            -> api + web + postgres + redis + worker
#     (or `make phase2-up`, which also checks the password and waits for health)
#
#   Production (HTTPS on 443 via Caddy, Let's Encrypt):
#     docker compose [--profile phase2] -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Configuration comes from a `.env` file next to this file (copy .env.example). Compose
# reads it automatically for ${VAR} interpolation below.
#
# How the signal branch is switched on: `api` reads DATABASE_URL and enables the job API
# only when it is set (app/config.py). Below, DATABASE_URL and CELERY_BROKER_URL are
# derived from POSTGRES_PASSWORD (`${VAR:+...}` = "only when VAR is set"), so without a
# password the api starts with the branch disabled and never tries to reach Postgres,
# and with one it expects the `phase2` profile services. `postgres`, `redis` and `worker`
# carry `profiles: ["phase2"]`: validated always, created only with the profile. Put
# COMPOSE_PROFILES=phase2 next to POSTGRES_PASSWORD in .env (Compose reads it from there)
# so every `docker compose up/down` -- with or without the prod override -- includes them;
# a password without the profile would leave the api retrying a Postgres that never comes.
# The signal branch also needs RMODHUB_IP_HASH_SECRET: the api container refuses to start
# with the development default (deploy/api-entrypoint.py).

name: rmodhub

# Shared by api and worker (predictor settings, thread limits, log level).
x-app-env: &app-env
  RMODHUB_PREDICTOR: ${RMODHUB_PREDICTOR:-multirm}
  RMODHUB_MAX_SEQUENCE_NT: ${RMODHUB_MAX_SEQUENCE_NT:-10000}
  RMODHUB_WARMUP: ${RMODHUB_WARMUP:-true}
  RMODHUB_LOG_LEVEL: ${RMODHUB_LOG_LEVEL:-info}
  # Optional: only forwarded to the container when set in .env / the shell (an empty
  # value would fail pydantic parsing of `int | None` / JSON list).
  RMODHUB_TORCH_THREADS:
  RMODHUB_CORS_ORIGINS:

# Signal-branch wiring (job queue + metadata store + limits; docs/signal-branch.md §8).
# Attached to `api` and `worker`; the worker overrides the two URLs unconditionally.
x-phase2-env: &phase2-env
  DATABASE_URL: ${POSTGRES_PASSWORD:+postgresql+psycopg://rmodhub:${POSTGRES_PASSWORD}@postgres:5432/rmodhub}
  CELERY_BROKER_URL: ${POSTGRES_PASSWORD:+redis://redis:6379/0}
  RMODHUB_UPLOAD_DIR: /data/uploads
  RMODHUB_MAX_POD5_GB: ${RMODHUB_MAX_POD5_GB:-5}
  RMODHUB_MAX_BAM_GB: ${RMODHUB_MAX_BAM_GB:-5}
  RMODHUB_MAX_REFERENCE_MB: ${RMODHUB_MAX_REFERENCE_MB:-500}
  RMODHUB_MAX_REGIONS: ${RMODHUB_MAX_REGIONS:-10000}
  RMODHUB_MAX_RUNNING_PER_IP: ${RMODHUB_MAX_RUNNING_PER_IP:-1}
  RMODHUB_MAX_QUEUED_PER_IP: ${RMODHUB_MAX_QUEUED_PER_IP:-3}
  RMODHUB_JOB_TIMEOUT_S: ${RMODHUB_JOB_TIMEOUT_S:-21600}
  RMODHUB_RESULTS_RETENTION_DAYS: ${RMODHUB_RESULTS_RETENTION_DAYS:-14}
  RMODHUB_INPUTS_MAX_AGE_H: ${RMODHUB_INPUTS_MAX_AGE_H:-48}
  RMODHUB_UPLOAD_TTL_H: ${RMODHUB_UPLOAD_TTL_H:-48}
  RMODHUB_TUS_CHUNK_MB: ${RMODHUB_TUS_CHUNK_MB:-64}
  RMODHUB_CLEANUP_INTERVAL_S: ${RMODHUB_CLEANUP_INTERVAL_S:-3600}
  # HMAC key behind `client_key` (raw addresses are never stored). No fallback on purpose:
  # unset, the api falls back to its own development default and refuses to start the
  # signal branch (RMODHUB_ALLOW_DEV_SECRET=1 overrides that for local experiments).
  RMODHUB_IP_HASH_SECRET:
  RMODHUB_ALLOW_DEV_SECRET:

x-healthcheck-api: &healthcheck-api
  # /health is 200 only once the model is loaded (503 before). start_period covers a
  # slow 1-core box (~30 s load); start_interval polls fast during that window so
  # `docker compose up --wait` returns as soon as the model is ready.
  test:
    - CMD
    - python
    - -c
    - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s
  start_interval: 3s

services:
  # ---------------------------------------------------------------------------
  # API: synchronous sequence prediction (MultiRM, CPU-only torch) + the signal
  # branch job API / tus uploads / Celery producer when DATABASE_URL is set.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rmodhub-api:local
    restart: unless-stopped
    ports:
      # Host port is configurable; docker-compose.prod.yml removes this mapping and
      # puts Caddy in front instead.
      - "${RMODHUB_PORT:-8000}:8000"
    environment:
      <<: [*app-env, *phase2-env]
      # Proxies whose X-Forwarded-For/-Proto uvicorn believes (comma-separated IPs/CIDRs).
      # Unset = the container's own network(s), i.e. this compose network (web, caddy);
      # set it when the reverse proxy sits outside the compose network.
      RMODHUB_TRUSTED_PROXIES:
    volumes:
      # Shared with the worker: tus partial uploads, jobs/<id>/{input,work,results.sqlite}.
      - uploads:/data/uploads
    depends_on:
      # `required: false` keeps a plain `docker compose up` valid without the profile
      # (verified: without it Compose rejects the file); with the profile the api waits
      # for both services to be healthy.
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    # Model + torch runtime is ~300-500 MB RSS; 3 GiB leaves headroom for concurrent
    # requests on long (10 kb) inputs. `mem_limit` is the plain-compose spelling,
    # `deploy.resources` the Compose-spec one; Compose v2 honours both.
    mem_limit: 3g
    deploy:
      resources:
        limits:
          memory: 3g
    security_opt:
      - no-new-privileges:true
    healthcheck: *healthcheck-api

  # ---------------------------------------------------------------------------
  # Web UI: nginx serving the built React app and proxying /api, /health, /docs,
  # /openapi.json and /static to `api` (frontend/nginx.conf). Browsers only need this
  # container; `api` keeps its own host port so developers can curl it directly.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: rmodhub-web:local
    restart: unless-stopped
    ports:
      # http://localhost:8080 by default. docker-compose.prod.yml removes this mapping
      # and puts Caddy (HTTPS on 443) in front of nginx instead.
      - "${RMODHUB_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    # nginx + static files: a few tens of MB.
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Answered by nginx itself (frontend/nginx.conf); does not depend on api.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  # ---------------------------------------------------------------------------
  # Signal branch (profile "phase2"): job metadata store, broker and the DirectRM worker.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    profiles: ["phase2"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: rmodhub
      POSTGRES_USER: rmodhub
      # Set POSTGRES_PASSWORD in .env; the fallback exists only so `docker compose
      # config` validates without one. Never run the profile with the default.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Job metadata only (a few rows per job); shm for sorts/parallel workers.
    mem_limit: 768m
    deploy:
      resources:
        limits:
          memory: 768m
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmodhub -d rmodhub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    profiles: ["phase2"]
    restart: unless-stopped
    # Broker only (no result backend). The append-only file keeps queued jobs across a
    # restart; memory is bounded and a full broker fails loudly instead of evicting.
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    mem_limit: 384m
    deploy:
      resources:
        limits:
          memory: 384m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    # Own image: Python 3.10 + Remora + CPU torch + the vendored DirectRM (worker/).
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: rmodhub-worker:local
    profiles: ["phase2"]
    restart: unless-stopped
    # One job at a time, no prefetch, only the `signal` queue (docs/signal-branch.md §7).
    command: ["celery", "-A", "rmodhub_worker.celery_app", "worker", "--loglevel=info", "--concurrency=1", "--prefetch-multiplier=1", "-Q", "signal"]
    environment:
      <<: [*app-env, *phase2-env]
      # The worker only exists inside the profile, so its URLs are unconditional.
      DATABASE_URL: postgresql+psycopg://rmodhub:${POSTGRES_PASSWORD:-change-me}@postgres:5432/rmodhub
      CELERY_BROKER_URL: redis://redis:6379/0
      OMP_NUM_THREADS: ${RMODHUB_WORKER_THREADS:-4}
      MKL_NUM_THREADS: ${RMODHUB_WORKER_THREADS:-4}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # torch + Remora + pod5 buffers on a 10k-region job peak at a few GB; memswap ==
    # mem so an over-budget job is killed instead of swapping the box to a halt.
    mem_limit: 6g
    memswap_limit: 6g
    deploy:
      resources:
        limits:
          memory: 6g
    security_opt:
      - no-new-privileges:true
    # Time for the SIGTERM handler to kill the DirectRM subprocess and mark the job.
    stop_grace_period: 60s
    healthcheck:
      # The Celery control plane answers while a task runs (prefork parent).
      # `$$HOSTNAME` is escaped for Compose and expanded by the container shell.
      test: ["CMD-SHELL", "celery -A rmodhub_worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null 2>&1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s
      start_interval: 5s

volumes:
  # Postgres data directory (job metadata).
  pgdata:
  # Redis append-only file (queued job ids survive a restart).
  redisdata:
  # pod5/BAM uploads, tus partials, worker scratch and results.sqlite, shared by api
  # (receives, serves results, cleans up) and worker (processes, deletes inputs).
  uploads:
