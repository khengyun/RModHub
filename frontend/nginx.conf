# RModHub web server: serves the built SPA and proxies the API paths to the `api`
# container. Installed as /etc/nginx/conf.d/default.conf (see Dockerfile); the image's
# /etc/nginx/nginx.conf (workers, mime types, access-log format) stays untouched.
#
#   dev:  `docker compose up` publishes this server on ${RMODHUB_WEB_PORT:-8080}.
#   prod: Caddy (docker-compose.prod.yml) terminates TLS on 443 and forwards to web:80.
#
# Routing
#   /healthz                         nginx liveness, answered here
#   = /api/uploads                   tus OPTIONS (capabilities), proxied as-is
#   /api/uploads/                    tus chunks (PATCH/HEAD/DELETE): 64 MiB bodies, unbuffered
#   = /api/jobs/signal               one-shot multipart job submission: unlimited, unbuffered
#   /api/ /health /docs /openapi.json /static/   -> http://api:8000 (FastAPI + Swagger UI), 1 MiB bodies
#   /assets/                         hashed build files, cached for a year
#   everything else                  SPA: file if it exists, else index.html (client routing)

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version (Caddy also strips the Server header in prod).
    server_tokens off;

    # Default bound, same as Caddy: a sequence request is a ~10 kb JSON body at most.
    # The two upload locations below raise it for themselves only.
    client_max_body_size 1m;

    # --- compression -----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv text/javascript application/javascript
               application/json image/svg+xml;

    # --- upstream --------------------------------------------------------------------
    # 127.0.0.11 is Docker's embedded DNS on the compose network. Putting the upstream in
    # a variable makes nginx resolve `api` at request time (re-checked every 10 s), so a
    # recreated api container with a new IP keeps working and nginx starts even while
    # api is still coming up. With no URI part in the variable, the original request
    # URI (path + query string) is forwarded unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # Behind Caddy, keep the scheme the browser actually used (https); otherwise ours.
    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto) {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    # Proxy settings are inherited by every proxied location below. Scoring a 10,000-nt
    # input takes ~13 s on one CPU core; 180 s leaves room for a loaded box. Bodies are
    # tiny, so the send timeout stays short. Do NOT add proxy_set_header inside a
    # location: that would cancel the inheritance of the whole set below.
    #
    # Client address: X-Forwarded-For is *appended* ($proxy_add_x_forwarded_for), the
    # standard hop-by-hop form. uvicorn (--proxy-headers) only believes the header when
    # its direct peer -- this container -- is inside its trusted-proxy list (the compose
    # network, see deploy/api-entrypoint.py) and then walks the list from the right,
    # stopping at the first address that is not a trusted proxy: a browser-supplied
    # "X-Forwarded-For: 203.0.113.9" arrives as "203.0.113.9, <real client>" and the real
    # client wins; behind Caddy (which replaces the inbound header with the TLS client's
    # address) it arrives as "<client>, <caddy>" and the client wins. Overwriting with
    # $remote_addr instead would lose the client behind Caddy. Docker's gateway address
    # (what localhost / userland-proxied connections to a published port look like) is
    # deliberately not a trusted proxy.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # --- nginx liveness (no dependency on the api container) ------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # --- nanopore uploads (signal branch) -------------------------------------------
    # Longest-prefix / exact matches win over `/api/`, so only these two paths get the
    # bigger bodies. `proxy_request_buffering off` streams each chunk straight to the
    # api instead of spooling it into this container's writable layer; the longer
    # timeouts cover a slow client feeding an unbuffered body and the api's validation
    # after the last byte. The tus client sends 16 MiB chunks; 64m matches the api's
    # RMODHUB_TUS_CHUNK_MB default and Caddy's 64MiB.
    # `OPTIONS /api/uploads` (tus capability discovery, no trailing slash) must reach the
    # api: a prefix location ending in "/" would answer it with nginx's own 301 instead.
    location = /api/uploads { proxy_pass $api; }
    location /api/uploads/ {
        client_max_body_size 64m;
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_timeout 300s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass $api;
    }
    # One-shot multipart submission (pod5 + BAM + reference + regions, several GB):
    # the api enforces the per-file caps itself while streaming.
    location = /api/jobs/signal {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass $api;
    }

    # --- API + self-hosted Swagger UI, proxied ---------------------------------------
    # Deliberately NO add_header here: /docs (Swagger UI) needs inline scripts, so the
    # SPA's Content-Security-Policy must not apply, and the API's own headers pass
    # through untouched.
    location /api/            { proxy_pass $api; }
    location = /health        { proxy_pass $api; }
    location = /docs          { proxy_pass $api; }
    location = /openapi.json  { proxy_pass $api; }
    location /static/         { proxy_pass $api; }

    # --- hashed build assets (vite: /assets/<name>-<hash>.js|css): cache for a year ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- SPA -------------------------------------------------------------------------
    # index.html must be revalidated on every load (it names the current hashed assets).
    # CSP: everything from this origin only; 'unsafe-inline' for styles because React
    # inline style attributes (per-modification colours) are governed by style-src;
    # data:/blob: images cover the SVG favicon and in-browser downloads.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
