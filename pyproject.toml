[project]
name = "rmodhub"
version = "0.1.0"
description = "RNA modification site prediction web server (MultiRM sequence branch, DirectRM signal branch planned)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "torch>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

# CPU-only torch wheels: the default PyPI build pulls multi-GB CUDA libs that are useless here.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["slow: cold-process start-up and 10 kb inputs (a few seconds each)"]
filterwarnings = [
    # starlette's TestClient warns that httpx 1.x support is deprecated in favour of httpx2.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
